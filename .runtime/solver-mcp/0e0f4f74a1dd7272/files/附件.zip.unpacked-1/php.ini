; hardcar CTF challenge PHP 配置
; 关闭页面错误显示，错误记录到容器日志（便于部署排查）
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING

; 上传相关
file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 30
memory_limit = 128M

; 会话
session.use_strict_mode = 1
