                    - paragraph [ref=f6e194]: PWN 的第一步，不是漏洞利用，而是先学会看懂代码。 这一关需要你掌握最基础的 C 语言、Python 与 x86-64 汇编。你不需要一开始就成为某门语言的大师，但至少应该能够读懂简单的 C 程序、使用 Python 编写脚本，并认识常见的寄存器与汇编指令。 完成这些基础内容后，找到隐藏在教程中的 FLAG，正式迈出 PWN 的第一步。 C 语言是大多数 PWN 题目的基础，Python 常用于编写利用脚本，而汇编则是理解程序底层行为、栈帧、函数调用和后续漏洞利用的重要基础。
